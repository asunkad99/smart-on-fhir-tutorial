<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>My SMART App</title>
  <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
  <style>
    /* Simple spinner */
    .spinner { text-align: center; margin-top: 50px; }
    .spinner div { display: inline-block; width: 18px; height: 18px; margin: 3px; background-color: #333; border-radius: 100%; animation: bouncedelay 1.4s infinite ease-in-out both; }
    .bounce1 { animation-delay: -0.32s; }
    .bounce2 { animation-delay: -0.16s; }
    @keyframes bouncedelay {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1.0); }
    }
  </style>
</head>
<body>

  <div id="loading" class="spinner">
    <div class="bounce1"></div>
    <div class="bounce2"></div>
    <div class="bounce3"></div>
  </div>

  <div id="holder" style="display:none">
    <p>First Name: <span id="fname"></span></p>
    <p>Last Name: <span id="lname"></span></p>
    <p>Gender: <span id="gender"></span></p>
    <p>Birthdate: <span id="birthdate"></span></p>
    <p>Height: <span id="height"></span></p>
    <p>Systolic BP: <span id="systolicbp"></span></p>
    <p>Diastolic BP: <span id="diastolicbp"></span></p>
    <p>LDL: <span id="ldl"></span></p>
    <p>HDL: <span id="hdl"></span></p>
  </div>

  <!-- FHIR Client JS -->
  <script src='./lib/js/fhir-client-v0.1.12.js'></script>
  <script src='./lib/js/fhir-client-cerner-additions-1.0.0.js'></script>
  <script src='example-smart-app.js'></script>

  <script>
    // Wait for OAuth2 launch and fetch patient data
    FHIR.oauth2.ready(function(smart) {
      console.log("SMART client ready", smart);
      window.extractData()
        .then(function(patient) {
          console.log("Patient data received:", patient);
          window.drawVisualization(patient);
        })
        .fail(function() {
          alert("Error loading patient data.");
        });
    }, function(error) {
      console.error("OAuth2 launch failed", error);
    });
  </script>

</body>
</html>
